stages:
  pull_data:
    cmd: mkdir -p data/raw && poetry run kaggle competitions download -c playground-series-s4e12
      && mv playground-series-s4e12.zip data/raw/ && cd data/raw/ && unzip playground-series-s4e12.zip
      && rm playground-series-s4e12.zip
    outs:
    - data/raw

  prepare_basic:
    cmd: poetry run python insurance/prepare_basic.py
    deps:
    - insurance/prepare_basic.py
    - insurance/data_pipeline.py
    params:
    - data.random_state
    outs:
    - data/prepared/train_data.feather
    - data/prepared/test_data.feather
    - out/data_pipeline_train.pkl

  train_layer_0:
    foreach: ${layer_0}
    do:
      cmd: poetry run python insurance/train_unit.py --layer 0 --model-name ${key}
        --model-type ${item.type}
      deps:
      - data/prepared/train_data.feather
      - data/prepared/test_data.feather
      - insurance/train_unit.py
      outs:
      - data/oof/layer_0/model_${key}.feather
      - data/preds/layer_0/model_${key}.feather


  summarize_layer_0:
    cmd: poetry run python insurance/summarize_layer.py --layer 0
    params:
    - layer_0
    deps:
    - data/oof/layer_0/
    - data/preds/layer_0/
    outs:
    - data/oof/layer_0_concatenated.feather
    - data/preds/layer_0_concatenated.feather

  train_layer_1:
    foreach: ${layer_1}
    do:
      cmd: poetry run python insurance/train_unit.py --layer 1 --model-name ${key}
        --model-type ${item.type}
      deps:
      - insurance/train_unit.py
      - data/oof/layer_0_concatenated.feather
      - data/preds/layer_0_concatenated.feather
      outs:
      - data/oof/layer_1/model_${key}.feather
      - data/preds/layer_1/model_${key}.feather


  summarize_layer_1:
    cmd: poetry run python insurance/summarize_layer.py --layer 1
    params:
    - layer_1
    deps:
    - data/oof/layer_1/
    - data/preds/layer_1/
    outs:
    - data/oof/layer_1_concatenated.feather
    - data/preds/layer_1_concatenated.feather

  train_ensemble:
    foreach: ${ensemble}
    do:
      cmd: poetry run python insurance/train_ensemble.py --layer ${item.layer} --ensemble-name
        ${key}
      deps:
      - data/oof/layer_${item.layer}_concatenated.feather
      - data/preds/layer_${item.layer}_concatenated.feather
      - insurance/train_ensemble.py
      outs:
      - out/layer_${item.layer}_preds_${key}.csv   # Can be final submission to kaggle



