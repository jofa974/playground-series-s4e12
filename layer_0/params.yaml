data:
  random_state: 42

layer: 0

models:
  xgboost:
    type: xgboost
    params:
      n_estimators: 10
      learning_rate: 0.6
      max_depth: 5
      reg_lambda: 10
      reg_alpha: 0.1
      random_state: 42
      # num_leaves: None
      # min_child_weight: 1
      objective: reg:squarederror
      eval_metric: rmse
      device: cuda
      # tree_method: hist
      verbosity: 0
      enable_categorical: True
  catboost:
    type: catboost
    params:
      iterations: 10
      #learning_rate: 0.33741802035300733
      learning_rate: 0.5
      depth: 4
      l2_leaf_reg: 0.6988750565188863
      loss_function: "RMSE"
      random_strength: 0.001326565507721897
      bagging_temperature: 0.5233508452963999
      task_type: GPU
